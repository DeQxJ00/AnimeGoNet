*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--fg);background:var(--bg)}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{border:0;background:transparent}a{color:var(--accent)}.app{height:100dvh;display:flex;flex-direction:column}.top{padding:22px 28px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;flex-wrap:wrap}.brand{margin-right:auto}.eyebrow{font-size:11px;letter-spacing:2.5px;color:var(--muted);margin-bottom:5px}.brand h1{font-size:20px;margin:0;font-weight:600;letter-spacing:.2px}.tool{padding:8px 11px;border-radius:7px;font-size:13px;white-space:nowrap}.tool:hover{background:var(--hover)}.tool.active{color:var(--accent);background:var(--hover)}.searchbox{position:relative;width:248px}.searchbox input{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px 12px;color:var(--fg);font-size:13px}.results{position:absolute;right:0;top:45px;width:360px;max-height:400px;overflow:auto;background:var(--panel);box-shadow:var(--shadow);border:1px solid var(--line);border-radius:9px;z-index:20;padding:6px}.result{display:block;width:100%;text-align:left;padding:11px;border-radius:5px;font-size:13px;line-height:1.5}.result:hover{background:var(--hover)}.result small{display:block;color:var(--muted);margin-top:4px}.noresult{padding:14px;color:var(--muted);font-size:13px}.subbar{padding:10px 28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:48px}.crumb{display:flex;gap:8px;align-items:center;font-size:13px}.crumb button{padding:5px 0;color:var(--muted)}.crumb button:hover{color:var(--fg)}.subbar .spacer{flex:1}.hint{font-size:12px;color:var(--muted)}.workspace{min-height:0;flex:1;display:flex;position:relative}.viewport{flex:1;min-width:0;position:relative;overflow:hidden;touch-action:none;cursor:grab;background-image:radial-gradient(var(--line) .7px,transparent .7px);background-size:24px 24px}.viewport.dragging{cursor:grabbing}.world{position:absolute;top:0;left:0;width:1px;height:1px;transform-origin:0 0}.links{position:absolute;overflow:visible;width:1px;height:1px;pointer-events:none}.link{fill:none;stroke-width:1.6;opacity:.58}.node{position:absolute;display:flex;align-items:stretch;color:var(--fg);border-radius:9px;background:var(--panel);border:1px solid color-mix(in srgb,var(--tone) 35%,var(--line));box-shadow:0 2px 5px #00000008}.node:hover{background:var(--hover);border-color:var(--tone)}.node.selected{border-color:var(--tone);box-shadow:0 0 0 2px color-mix(in srgb,var(--tone) 18%,transparent)}.node-label{flex:1;min-width:0;text-align:left;padding:11px 15px;line-height:1.55;font-size:14px;overflow-wrap:anywhere}.node.branch .node-label{font-size:15px;font-weight:500}.node.root{background:color-mix(in srgb,var(--accent) 10%,var(--panel));border:1px solid var(--accent);border-radius:13px}.node.root .node-label{font-size:22px;font-weight:600;text-align:center;padding:20px 12px}.node.root .note{font-size:12px;font-weight:400;margin-top:8px}.node .note{display:block;font-size:11px;color:var(--muted);font-weight:400;line-height:1.4;margin-top:5px}.node.detail,.node.rule{border:0;border-bottom:1px solid color-mix(in srgb,var(--tone) 48%,var(--line));border-radius:0;background:color-mix(in srgb,var(--bg) 94%,var(--tone))}.node.detail .node-label,.node.rule .node-label{font-size:14px;line-height:1.65;padding:12px 10px}.toggle{width:28px;flex:none;font-size:17px;border-left:1px solid var(--line);color:var(--tone);border-radius:0 8px 8px 0}.toggle:hover{background:color-mix(in srgb,var(--tone) 12%,transparent)}.branch-number{color:var(--tone);margin-right:8px;font-size:11px;font-weight:600}.inspector{width:346px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:22px;line-height:1.7;font-size:14px}.inspector[hidden]{display:none}.inspector .close{float:right;font-size:21px;color:var(--muted);padding:0 5px}.inspector h2{font-size:19px;font-weight:500;margin:16px 0}.inspector h3{font-size:12px;letter-spacing:.5px;color:var(--muted);font-weight:500;margin:26px 0 8px}.inspector p{margin:8px 0;overflow-wrap:anywhere}.inspector .small{font-size:12px;color:var(--muted)}.relation{display:block;text-align:left;width:100%;padding:10px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.6}.relation span{display:block;font-size:11px;color:var(--muted)}.relation:hover{color:var(--accent)}.inspector .constraints{padding-left:12px;border-left:2px solid var(--tone)}.viewcontrols{position:absolute;left:24px;bottom:20px;display:flex;align-items:center;gap:3px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:4px;box-shadow:0 3px 12px #0001;z-index:3}.viewcontrols button{padding:7px 12px;font-size:15px;border-radius:5px}.viewcontrols button:hover{background:var(--hover)}#zoom-label{font-size:12px;width:48px;text-align:center;color:var(--muted)}.footer{display:flex;justify-content:space-between;gap:12px;padding:10px 28px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}[hidden]{display:none!important}
@media(max-width:760px){.top{padding:15px;gap:8px}.brand{width:100%}.brand h1{font-size:18px}.searchbox{width:100%;order:4}.results{width:100%}.subbar{padding:6px 15px}.hint{display:none}.inspector{position:absolute;right:0;top:0;bottom:0;width:min(346px,90vw);z-index:5;box-shadow:var(--shadow)}.footer{padding:9px 15px}.footer span:last-child{display:none}.viewcontrols{left:15px;bottom:15px}}

<style>
.node.decision{border-color:color-mix(in srgb,var(--tone1) 65%,var(--line));background:color-mix(in srgb,var(--tone1) 7%,var(--panel))}.node.goto{border-style:dashed;background:color-mix(in srgb,var(--accent) 5%,var(--panel))}.node.terminal{border-radius:22px}.incoming{display:block;font-size:12px;font-weight:500;line-height:1.45;color:var(--tone);margin-bottom:7px}.type-label{display:block;font-size:10px;letter-spacing:1px;color:var(--muted);margin-bottom:3px}.node.decision .type-label{color:var(--tone1)}.node.goto .type-label{color:var(--accent)}.route-rail{padding:0 28px 10px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}.route-rail button{padding:5px 8px;border-radius:5px}.route-rail button:hover{background:var(--hover);color:var(--fg)}.route-rail .optional{border:1px dashed var(--line)}.explain{font-size:12px;color:var(--muted);max-width:460px}.crumb{flex-wrap:wrap}.evidence{font-size:11px;overflow-wrap:anywhere}.node-label{padding:12px 14px}.node.root .node-label{padding:20px 12px}

</style>
<style>

<body>
<div class="app">
<header class="top"><div class="brand"><div class="eyebrow">ANIMEGONET / LOGIC MAP</div><h1>联合决策图册</h1></div><button class="tool" id="home">回到总览</button><button class="tool" id="expand-level">展开一级</button><button class="tool" id="collapse">收起分支</button><button class="tool" id="theme" aria-label="切换明暗主题">浅色模式</button><div class="searchbox"><input id="search" type="search" aria-label="搜索节点与规则" placeholder="搜索 EP、AniDB、做种…" autocomplete="off"><div id="results" class="results" hidden></div></div></header>
<div class="subbar"><nav class="crumb" aria-label="当前分支"><button id="crumb-root">AnimeGoNet</button><span id="crumb-detail" hidden></span></nav><span class="spacer"></span><span class="explain">实线箭头 = 下一步 · 判断节点按条件分支 · ↗ = 跳转继续</span></div>
<nav class="route-rail atlas-rail" aria-label="联合章节">
<button data-stage="source-start">01 来源接入</button><span>→</span>
<button data-stage="source-media">02 类型分流</button><span>→</span>
<button data-stage="mikan-trusted">Mikan TV</button><button data-stage="u2-aid">U2 TV</button><button data-stage="movie-count">Movie</button><span>→</span>
<button data-stage="episode-source">03 EP 门禁</button><span>→</span>
<button data-stage="ai-enabled" class="optional">04 统一 AI</button><button data-stage="ai-series-verify">05 AI 复验</button><span>→</span>
<button data-stage="classify-start">06 归类 / 提交</button><button data-stage="download-source">07 下载</button><button data-stage="strategy-kind">08 整理 / 做种</button><button data-stage="failure-context">09 失败恢复</button>
</nav><section class="atlas-context" aria-label="当前阅读上下文"><button id="atlas-back" disabled>← 上一步</button><div><strong id="atlas-current">来源接入</strong><span id="atlas-origin">按箭头查看条件；顶部章节是导航，不代表所有分支都要执行。</span></div><button id="atlas-reset">清空路径</button></section>
<section id="atlas-ai-context" class="atlas-ai" hidden><span id="atlas-ai-label"></span><button id="atlas-ai-return">查看该入口失败去向 →</button><button id="atlas-ai-success">查看全部复验成功后的去向 →</button></section>
<main class="workspace"><section class="viewport" id="viewport" aria-label="可展开的逻辑思维导图"><div class="world" id="world"><svg class="links" id="links" aria-hidden="true"></svg><div id="nodes"></div></div><div class="viewcontrols"><button id="zoom-out" aria-label="缩小">−</button><span id="zoom-label">100%</span><button id="zoom-in" aria-label="放大">＋</button><button id="fit">适应视图</button><button id="actual">1:1</button></div></section><aside class="inspector" id="inspector" aria-label="节点详情" hidden></aside></main>
<footer class="footer"><span id="status" role="status" aria-live="polite">展开分支查看完整规则</span><span>v1.2.1 · 依据实际代码标注分支与返回点</span></footer>
</div>

function atlasSnapshot(){return {id:scope,origin:atlasOrigin?{...atlasOrigin}:null};}
function atlasDetectOrigin(id){
 if(id!=='ai-enabled'&&id!=='episode-ai-gate')return;
 if(scope==='episode-ai-gate')return;
 const current=byId.get(scope);
 const branch=current?topBranch(current).id:'';
 if(branch==='lane-mikan'||scope.startsWith('mikan-')&&!scope.startsWith('mikan-ep-'))atlasOrigin={kind:'mikan-season',label:'Mikan 作品 / 季度入口',id:scope};
 else if(scope.startsWith('u2-ep-')||scope.startsWith('u2-dup')||scope.startsWith('u2-outside')||scope.startsWith('u2-unparsed')||scope.startsWith('u2-one-video')||scope.startsWith('u2-exact')||scope.startsWith('u2-anidb')||scope.startsWith('mikan-ep-')||branch==='lane-episode')atlasOrigin={kind:'episode',label:'Episode / 整 Torrent 门禁入口',id:scope};
 else if(scope.startsWith('u2-'))atlasOrigin={kind:'u2-series',label:'U2 作品 / 季度入口',id:scope};
}
function atlasSync(){
 const n=byId.get(scope);
 $('atlas-current').textContent=n?n.label:'阶段总览';
 $('atlas-origin').textContent=atlasHistory.length?'阅读路径：'+atlasHistory.slice(-4).map(s=>byId.get(s.id)?.label||s.id).join(' → '):'点击节点查看详细条件；点击 ＋ 展开；虚线章节目录不是执行顺序。';
 $('atlas-back').disabled=!atlasHistory.length;
 const aiArea=scope.startsWith('ai-')||scope==='episode-ai-gate';
 $('atlas-ai-context').hidden=!aiArea;
 $('atlas-ai-label').textContent=atlasOrigin?'当前 AI 上游：'+atlasOrigin.label:'AI 上游尚未选定：请从 Mikan、U2 或 Episode 的真实分支进入；不能推断失败出口。';
 $('atlas-ai-return').disabled=!atlasOrigin;
 document.querySelectorAll('[data-stage]').forEach(b=>b.classList.toggle('active',b.dataset.stage===scope));
 if(aiArea&&atlasOrigin)history.replaceState(null,'','#node='+encodeURIComponent(scope)+'&origin='+encodeURIComponent(atlasOrigin.kind)+'&from='+encodeURIComponent(atlasOrigin.id));
}
focusBranch=function(id){
 if(!byId.has(id))return;
 if(!atlasNavigating&&scope!==id){atlasHistory.push(atlasSnapshot());atlasDetectOrigin(id);}
 atlasBaseFocus(id);atlasSync();
};
overview=function(){if(!atlasNavigating&&scope!=='root')atlasHistory.push(atlasSnapshot());atlasBaseOverview();atlasSync();};
showDetails=function(n){
 atlasBaseDetails(n);
 const box=document.createElement('div');box.className='atlas-related';
 box.innerHTML='<h3>联合阅读</h3><button data-atlas="download-source">查看下载前的门禁 →</button><button data-atlas="strategy-kind">查看整理与做种策略 →</button><button data-atlas="failure-context">查看失败与重试分类 →</button>';
 $('inspector').append(box);box.querySelectorAll('button').forEach(b=>b.onclick=()=>focusBranch(b.dataset.atlas));
};
$('atlas-back').onclick=()=>{const previous=atlasHistory.pop();if(!previous)return;atlasNavigating=true;atlasOrigin=previous.origin;if(previous.id==='root')overview();else focusBranch(previous.id);atlasNavigating=false;atlasSync();};
$('atlas-reset').onclick=()=>{atlasHistory.length=0;atlasOrigin=null;atlasNavigating=true;focusBranch('source-start');atlasNavigating=false;atlasSync();};
$('atlas-ai-return').onclick=()=>{if(!atlasOrigin)return;focusBranch(atlasOrigin.kind==='mikan-season'?'mikan-after-ai':atlasOrigin.kind==='episode'?'ai-ep-retry':'failure-context');};
$('atlas-ai-success').onclick=()=>focusBranch('classify-start');
$('home').onclick=overview;$('crumb-root').onclick=overview;
document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{if(!b.dataset.stage.startsWith('ai-')&&b.dataset.stage!=='episode-ai-gate')atlasOrigin=null;focusBranch(b.dataset.stage);});
const atlasParams=new URLSearchParams(atlasIncomingLocation.slice(1)),atlasKnown={ 'mikan-season':'Mikan 作品 / 季度入口','u2-series':'U2 作品 / 季度入口','episode':'Episode / 整 Torrent 门禁入口'};
if(atlasKnown[atlasParams.get('origin')]&&byId.has(atlasParams.get('from')))atlasOrigin={kind:atlasParams.get('origin'),label:atlasKnown[atlasParams.get('origin')],id:atlasParams.get('from')};
atlasHistory.length=0;atlasNavigating=true;focusBranch(byId.has(atlasParams.get('node'))?atlasParams.get('node'):'source-start');atlasNavigating=false;atlasSync();
window.addEventListener('hashchange',()=>{const p=new URLSearchParams(location.hash.slice(1));if(!byId.has(p.get('node')))return;atlasOrigin=atlasKnown[p.get('origin')]&&byId.has(p.get('from'))?{kind:p.get('origin'),label:atlasKnown[p.get('origin')],id:p.get('from')}:null;atlasNavigating=true;focusBranch(p.get('node'));atlasNavigating=false;atlasSync();});
</script>
</body></html>
