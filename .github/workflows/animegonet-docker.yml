name: AnimeGoNet Docker

on:
  push:
    branches: [main, develop, "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animegonet-docker-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  multi-platform-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.animegonet
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install WebUI E2E dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.animegonet
          platforms: linux/amd64
          load: true
          tags: animegonet:ci
          cache-from: type=gha
      - name: Smoke container paths, API, SQLite and NativeAOT
        run: bash ./eng/smoke-container.sh animegonet:ci
      - name: Smoke release-container WebUI in Chromium
        run: ./eng/smoke-webui-container.sh animegonet:ci
      - name: Smoke full-chain qBittorrent, metadata, WebUI and external plugin isolation
        env:
          ANIMEGONET_FULL_CHAIN_WEBUI: "1"
        run: ./eng/smoke-qbittorrent-compose.sh animegonet:ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: webui-playwright-report
          path: |
            .artifacts/playwright-report
            .artifacts/playwright-results
          if-no-files-found: ignore
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [multi-platform-build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Validate release tag against the project version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          [xml]$props = Get-Content -LiteralPath Directory.Build.props -Raw
          $projectVersion = [string]($props.Project.PropertyGroup.Version | Select-Object -First 1)
          if ($tag -notmatch "^v$([regex]::Escape($projectVersion))(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?$") {
            throw 'GHCR release tag version must match Directory.Build.props.'
          }
      - name: Normalize the GHCR image name
        id: image
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Generate release image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.animegonet
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      - name: Attest published image provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Record immutable image digest
        shell: bash
        run: |
          printf '### GHCR image\n\n`ghcr.io/%s@%s`\n' \
            '${{ steps.image.outputs.name }}' \
            '${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
