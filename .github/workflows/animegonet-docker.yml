name: AnimeGoNet Docker

on:
  push:
    branches: [main, develop, "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animegonet-docker-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  multi-platform-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.animegonet
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install WebUI E2E dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.animegonet
          platforms: linux/amd64
          load: true
          tags: animegonet:ci
          cache-from: type=gha
      - name: Smoke container paths, API, SQLite and NativeAOT
        run: bash ./eng/smoke-container.sh animegonet:ci
      - name: Smoke release-container WebUI in Chromium
        run: ./eng/smoke-webui-container.sh animegonet:ci
      - name: Smoke full-chain qBittorrent, metadata, WebUI and external plugin isolation
        env:
          ANIMEGONET_FULL_CHAIN_WEBUI: "1"
        run: ./eng/smoke-qbittorrent-compose.sh animegonet:ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: webui-playwright-report
          path: |
            .artifacts/playwright-report
            .artifacts/playwright-results
          if-no-files-found: ignore
          retention-days: 14
