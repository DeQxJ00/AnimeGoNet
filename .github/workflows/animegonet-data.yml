name: AnimeGoNetData build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'

permissions:
  contents: read

jobs:
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - id: archive
        name: Resolve and verify official archive metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/bangumi/Archive/master/aux/latest.json \
            --output latest.json
          url=$(jq -er '.browser_download_url' latest.json)
          asset=$(jq -er '.name' latest.json)
          created=$(jq -er '.created_at' latest.json)
          digest=$(jq -er '.digest' latest.json)
          sha256=${digest#sha256:}
          [[ "$url" == "https://github.com/bangumi/Archive/releases/download/archive/$asset" ]]
          [[ "$asset" =~ ^dump-[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]{6}Z\.zip$ ]]
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$created" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          data_version=$(date --utc --date "$created" +%Y.%m.%d.1)
          generated_at=$(date --utc --date "$created" +%Y-%m-%dT%H:%M:%S.0000000+00:00)
          curl --fail --show-error --location "$url" --output "$asset"
          printf '%s  %s\n' "$sha256" "$asset" | sha256sum --check --strict
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "data_version=$data_version" >> "$GITHUB_OUTPUT"
          echo "generated_at=$generated_at" >> "$GITHUB_OUTPUT"
      - name: Build deterministic AnimeGoNetData package
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.archive.outputs.data_version }}'
          dotnet run --configuration Release \
            --project tools/AnimeGoNet.DataBuilder/AnimeGoNet.DataBuilder.csproj -- \
            --input '${{ steps.archive.outputs.asset }}' \
            --output "artifacts/animegonet-data-$version" \
            --data-version "$version" \
            --asset-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/animegonet-data-$version/" \
            --upstream-release archive \
            --upstream-asset '${{ steps.archive.outputs.asset }}' \
            --upstream-sha256 '${{ steps.archive.outputs.sha256 }}' \
            --generated-at-utc '${{ steps.archive.outputs.generated_at }}' \
            --minimum-subject-count 30000 \
            --minimum-episode-count 300000
      - uses: actions/upload-artifact@v4
        with:
          name: animegonet-data-${{ steps.archive.outputs.data_version }}
          path: artifacts/animegonet-data-${{ steps.archive.outputs.data_version }}/
          if-no-files-found: error
          retention-days: 7
