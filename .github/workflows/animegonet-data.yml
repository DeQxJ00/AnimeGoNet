name: AnimeGoNetData build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'

concurrency:
  group: animegonet-data-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  DATA_REPOSITORY: ${{ vars.ANIMEGONET_DATA_REPOSITORY }}
  DATA_TARGET: ${{ vars.ANIMEGONET_DATA_TARGET || 'main' }}

jobs:
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Validate external data repository boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DATA_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$DATA_REPOSITORY" != "$GITHUB_REPOSITORY" ]]
          [[ "$DATA_TARGET" =~ ^[A-Za-z0-9._/-]+$ ]]
      - id: archive
        name: Resolve and verify official archive metadata
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/bangumi/Archive/master/aux/latest.json \
            --output latest.json
          url=$(jq -er '.browser_download_url' latest.json)
          asset=$(jq -er '.name' latest.json)
          created=$(jq -er '.created_at' latest.json)
          digest=$(jq -er '.digest' latest.json)
          sha256=${digest#sha256:}
          [[ "$url" == "https://github.com/bangumi/Archive/releases/download/archive/$asset" ]]
          [[ "$asset" =~ ^dump-[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]{6}Z\.zip$ ]]
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$created" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          data_version=$(date --utc --date "$created" +%Y.%m.%d.%H%M%S)
          generated_at=$(date --utc --date "$created" +%Y-%m-%dT%H:%M:%S.0000000+00:00)
          curl --fail --show-error --location "$url" --output "$asset"
          printf '%s  %s\n' "$sha256" "$asset" | sha256sum --check --strict
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "data_version=$data_version" >> "$GITHUB_OUTPUT"
          echo "generated_at=$generated_at" >> "$GITHUB_OUTPUT"
      - name: Build deterministic AnimeGoNetData package
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.archive.outputs.data_version }}'
          dotnet run --configuration Release \
            --project tools/AnimeGoNet.DataBuilder/AnimeGoNet.DataBuilder.csproj -- \
            --input '${{ steps.archive.outputs.asset }}' \
            --output "artifacts/animegonet-data-$version" \
            --data-version "$version" \
            --asset-base-url "https://github.com/${DATA_REPOSITORY}/releases/download/animegonet-data-$version/" \
            --upstream-release archive \
            --upstream-asset '${{ steps.archive.outputs.asset }}' \
            --upstream-sha256 '${{ steps.archive.outputs.sha256 }}' \
            --generated-at-utc '${{ steps.archive.outputs.generated_at }}' \
            --minimum-subject-count 30000 \
            --minimum-episode-count 300000 \
            --minimum-relation-count 10000
      - uses: actions/upload-artifact@v7
        with:
          name: animegonet-data-${{ steps.archive.outputs.data_version }}
          path: artifacts/animegonet-data-${{ steps.archive.outputs.data_version }}/
          if-no-files-found: error
          retention-days: 7
      - name: Publish verified immutable release to AnimeGoNetData
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ANIMEGONET_DATA_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]]
          version='${{ steps.archive.outputs.data_version }}'
          tag="animegonet-data-$version"
          package_dir="artifacts/animegonet-data-$version"
          [[ -d "$package_dir" && -f "$package_dir/manifest.json" && -f "$package_dir/SHA256SUMS" ]]
          if find "$package_dir" -mindepth 1 -maxdepth 1 -type l | grep -q .; then
            echo 'Release directory contains a symbolic link.' >&2
            exit 1
          fi
          (cd "$package_dir" && sha256sum --check --strict SHA256SUMS)
          mapfile -t local_names < <(
            find "$package_dir" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort
          )
          [[ "${#local_names[@]}" -ge 4 ]]
          [[ "${#local_names[@]}" -le 100 ]]

          if release_json=$(gh api "repos/$DATA_REPOSITORY/releases/tags/$tag" 2>/dev/null); then
            :
          else
            gh release create "$tag" \
              --repo "$DATA_REPOSITORY" \
              --target "$DATA_TARGET" \
              --title "AnimeGoNetData $version" \
              --notes "Deterministic Bangumi Archive data package $version." \
              --draft
            release_json=$(gh api "repos/$DATA_REPOSITORY/releases/tags/$tag")
          fi
          release_id=$(jq -er '.id' <<<"$release_json")
          is_draft=$(jq -er '.draft' <<<"$release_json")
          [[ "$is_draft" == 'true' || "$is_draft" == 'false' ]]

          remote_assets=$(mktemp)
          cleanup() { rm -f "$remote_assets" "$remote_assets.names" "$package_dir.names"; }
          trap cleanup EXIT
          gh api "repos/$DATA_REPOSITORY/releases/$release_id/assets?per_page=100" > "$remote_assets"
          for name in "${local_names[@]}"; do
            local_path="$package_dir/$name"
            asset_count=$(jq --arg name "$name" '[.[] | select(.name == $name)] | length' "$remote_assets")
            if [[ "$asset_count" == '1' ]]; then
              asset_id=$(jq -er --arg name "$name" '.[] | select(.name == $name) | .id' "$remote_assets")
              remote_file=$(mktemp)
              gh api \
                -H 'Accept: application/octet-stream' \
                "repos/$DATA_REPOSITORY/releases/assets/$asset_id" > "$remote_file"
              cmp --silent "$local_path" "$remote_file" || {
                rm -f "$remote_file"
                echo "Immutable release asset differs: $name" >&2
                exit 1
              }
              rm -f "$remote_file"
            elif [[ "$asset_count" == '0' && "$is_draft" == 'true' ]]; then
              gh release upload "$tag" "$local_path" --repo "$DATA_REPOSITORY"
            else
              echo "Published release is incomplete or has duplicate asset: $name" >&2
              exit 1
            fi
          done

          gh api "repos/$DATA_REPOSITORY/releases/$release_id/assets?per_page=100" > "$remote_assets"
          printf '%s\n' "${local_names[@]}" > "$package_dir.names"
          jq -r '.[].name' "$remote_assets" | LC_ALL=C sort > "$remote_assets.names"
          cmp --silent "$package_dir.names" "$remote_assets.names" || {
            echo 'Remote release asset set differs from the generated package.' >&2
            exit 1
          }
          while IFS= read -r name; do
            asset_id=$(jq -er --arg name "$name" '.[] | select(.name == $name) | .id' "$remote_assets")
            remote_file=$(mktemp)
            gh api \
              -H 'Accept: application/octet-stream' \
              "repos/$DATA_REPOSITORY/releases/assets/$asset_id" > "$remote_file"
            cmp --silent "$package_dir/$name" "$remote_file" || {
              rm -f "$remote_file"
              echo "Post-upload verification failed: $name" >&2
              exit 1
            }
            rm -f "$remote_file"
          done < "$package_dir.names"

          if [[ "$is_draft" == 'true' ]]; then
            gh release edit "$tag" \
              --repo "$DATA_REPOSITORY" \
              --draft=false \
              --latest \
              --title "AnimeGoNetData $version"
          fi
