name: AnimeGo upstream Go baseline

on:
  push:
    branches: [main, develop, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animego-upstream-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-container-baseline:
    runs-on: ubuntu-24.04
    container:
      image: golang:1.22.10-bookworm
    steps:
      - name: Check out AnimeGoNet
        uses: actions/checkout@v6
      - name: Check out pinned AnimeGo baseline
        uses: actions/checkout@v6
        with:
          repository: wetor/AnimeGo
          ref: c7475dfc55a374cd0dd08821bf17125dab1e3145
          path: upstream-animego
          persist-credentials: false
      - name: Capture serial upstream Go test baseline
        shell: bash
        run: bash ./eng/capture-upstream-go-baseline.sh upstream-animego TestResults/upstream-go
      - name: Upload machine-readable upstream baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-animego-go-linux-amd64
          path: TestResults/upstream-go
          if-no-files-found: error
          retention-days: 30
