name: Decision Map Pages

on:
  push:
    branches: [main]
    paths:
      - docs/diagrams/animegonet-processing-mindmap.html
      - .github/workflows/decision-map-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decision-map-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Stage standalone decision map only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          install -m 644 docs/diagrams/animegonet-processing-mindmap.html _site/index.html
          install -m 644 docs/diagrams/animegonet-processing-mindmap.html _site/animegonet-processing-mindmap.html
          cmp _site/index.html _site/animegonet-processing-mindmap.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
