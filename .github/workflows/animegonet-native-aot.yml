name: AnimeGoNet NativeAOT

on:
  push:
    branches: [main, develop, "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animegonet-aot-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            rid: win-x64
            executable: AnimeGoNet.App.exe
            importer: AnimeGoNet.LegacyCacheImporter.exe
          - runner: windows-11-arm
            rid: win-arm64
            executable: AnimeGoNet.App.exe
            importer: AnimeGoNet.LegacyCacheImporter.exe
          - runner: ubuntu-24.04
            rid: linux-x64
            executable: AnimeGoNet.App
            importer: AnimeGoNet.LegacyCacheImporter
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
            executable: AnimeGoNet.App
            importer: AnimeGoNet.LegacyCacheImporter
          - runner: macos-15
            rid: osx-arm64
            executable: AnimeGoNet.App
            importer: AnimeGoNet.LegacyCacheImporter
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Assert native runner OS and architecture
        shell: pwsh
        run: ./eng/assert-native-runner.ps1 -RuntimeIdentifier "${{ matrix.rid }}"
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          architecture: ${{ endsWith(matrix.rid, 'arm64') && 'arm64' || 'x64' }}
      - name: Install Linux NativeAOT prerequisites
        if: startsWith(matrix.rid, 'linux-')
        run: sudo apt-get update && sudo apt-get install --yes clang zlib1g-dev
      - name: Restore RID graph
        shell: pwsh
        run: |
          dotnet restore src/AnimeGoNet.App/AnimeGoNet.App.csproj --runtime ${{ matrix.rid }} -p:PublishAot=true
          dotnet restore tools/AnimeGoNet.LegacyCacheImporter/AnimeGoNet.LegacyCacheImporter.csproj --runtime ${{ matrix.rid }} -p:PublishAot=true
      - name: Publish NativeAOT
        shell: pwsh
        run: |
          dotnet publish src/AnimeGoNet.App/AnimeGoNet.App.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --no-restore --output artifacts/publish/${{ matrix.rid }} -p:PublishAot=true -p:ContinuousIntegrationBuild=true
          dotnet publish tools/AnimeGoNet.LegacyCacheImporter/AnimeGoNet.LegacyCacheImporter.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --no-restore --output artifacts/publish/${{ matrix.rid }} -p:PublishAot=true -p:ContinuousIntegrationBuild=true
      - name: Smoke published binary
        shell: pwsh
        run: |
          ./eng/smoke-native.ps1 -Executable "artifacts/publish/${{ matrix.rid }}/${{ matrix.executable }}"
          ./eng/smoke-native.ps1 -Executable "artifacts/publish/${{ matrix.rid }}/${{ matrix.executable }}" -LegacyYamlUpgrade
          ./eng/smoke-native-cli.ps1 -Executable "artifacts/publish/${{ matrix.rid }}/${{ matrix.executable }}"
          ./eng/smoke-native-metadata.ps1 -Executable "artifacts/publish/${{ matrix.rid }}/${{ matrix.executable }}"
          ./eng/smoke-legacy-data-migration.ps1 `
            -Application "artifacts/publish/${{ matrix.rid }}/${{ matrix.executable }}" `
            -Importer "artifacts/publish/${{ matrix.rid }}/${{ matrix.importer }}"
      - name: Verify plugin SDK and NativeAOT template
        shell: pwsh
        run: ./eng/verify-plugin-template.ps1 -RuntimeIdentifier "${{ matrix.rid }}"
      - name: Generate checksums, SBOM and third-party licenses
        shell: pwsh
        run: |
          ./eng/generate-release-metadata.ps1 `
            -PublishDirectory "artifacts/publish/${{ matrix.rid }}" `
            -AssetsFile "src/AnimeGoNet.App/obj/project.assets.json" `
            -RuntimeIdentifier "${{ matrix.rid }}" `
            -Version "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}"
      - uses: actions/upload-artifact@v7
        with:
          name: animegonet-${{ matrix.rid }}
          path: artifacts/publish/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: animegonet-*
          path: artifacts/downloaded
      - name: Validate tag and package all NativeAOT artifacts
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw 'Release tags must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-SUFFIX.'
          }
          [xml]$props = Get-Content -LiteralPath Directory.Build.props -Raw
          $projectVersion = [string]($props.Project.PropertyGroup.Version | Select-Object -First 1)
          if ($tag -notmatch "^v$([regex]::Escape($projectVersion))(?:-|$)") {
            throw 'Release tag version must match Directory.Build.props.'
          }
          $rids = @('win-x64', 'win-arm64', 'linux-x64', 'linux-arm64', 'osx-arm64')
          New-Item -ItemType Directory -Path artifacts/release -ErrorAction Stop | Out-Null
          foreach ($rid in $rids) {
            $publish = Join-Path artifacts/downloaded "animegonet-$rid"
            if (-not (Test-Path -LiteralPath $publish -PathType Container)) {
              throw "Required NativeAOT artifact is missing: $rid"
            }
            ./eng/package-native-release.ps1 `
              -PublishDirectory $publish `
              -OutputDirectory artifacts/release `
              -RuntimeIdentifier $rid `
              -Version $tag
          }
          $archives = @(Get-ChildItem artifacts/release -File -Filter '*.zip')
          $checksums = @(Get-ChildItem artifacts/release -File -Filter '*.zip.sha256')
          if ($archives.Count -ne $rids.Count -or $checksums.Count -ne $rids.Count) {
            throw 'The release package set is incomplete.'
          }
      - name: Create immutable-input GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_args=(
            --verify-tag
            --generate-notes
            --title "AnimeGoNet ${GITHUB_REF_NAME}"
          )
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_args+=(--prerelease --latest=false)
          fi
          gh release create "${GITHUB_REF_NAME}" artifacts/release/* "${release_args[@]}"
