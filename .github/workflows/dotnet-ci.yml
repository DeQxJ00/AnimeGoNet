name: AnimeGoNet CI

on:
  push:
    branches: [main, develop, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animegonet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-cache-exporter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
          cache-dependency-path: tools/legacy-cache-exporter/go.sum
      - name: Test read-only legacy Bolt exporter
        working-directory: tools/legacy-cache-exporter
        run: go test ./...

  webui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check out pinned AnimeGoHelper userscript
        uses: actions/checkout@v6
        with:
          repository: DeQxJ00/AnimeGoHelper
          ref: 78a9d0d832801d38efd6294841e9962e0bc791cf
          path: .artifacts/upstream-animegohelper
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install WebUI build dependencies
        run: npm ci
      - name: Type-check WebUI
        run: npm run web:check
      - name: Test WebUI client
        run: npm run web:test
      - name: Install Chromium for AnimeGoHelper compatibility
        run: npx playwright install --with-deps chromium
      - name: Test unmodified AnimeGoHelper against Mikan fixture
        run: npm run helper:e2e
        env:
          ANIMEGOHELPER_SCRIPT_PATH: ${{ github.workspace }}/.artifacts/upstream-animegohelper/AnimeGoHelper.js
      - name: Verify committed WebUI output
        run: git diff --exit-code -- src/AnimeGoNet.App/wwwroot/app.js src/AnimeGoNet.App/wwwroot/api-client.js src/AnimeGoNet.App/wwwroot/ui-state.js

  build-test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Check out pinned AnimeGo behavior fixtures
        uses: actions/checkout@v6
        with:
          repository: wetor/AnimeGo
          ref: c7475dfc55a374cd0dd08821bf17125dab1e3145
          path: upstream-animego
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore dependencies
        run: dotnet restore AnimeGoNet.slnx
      - name: Build
        run: dotnet build AnimeGoNet.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true
      - name: Test
        run: dotnet test AnimeGoNet.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults
        env:
          ANIMEGO_UPSTREAM_REPO: ${{ github.workspace }}/upstream-animego
      - name: Smoke legacy cache and directory-sidecar migration
        shell: pwsh
        run: ./eng/smoke-legacy-data-migration.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.runner }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14
