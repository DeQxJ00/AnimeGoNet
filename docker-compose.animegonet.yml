services:
  animegonet:
    build:
      context: .
      dockerfile: Dockerfile.animegonet
    image: animegonet:local
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      ASPNETCORE_ENVIRONMENT: Container
      DOTNET_RUNNING_IN_CONTAINER: "true"
      inner_plugin_mikan__access_key: ${ANIMEGONET_ACCESS_KEY:?ANIMEGONET_ACCESS_KEY is required}
      webui_access_key: ${ANIMEGONET_WEBUI_ACCESS_KEY:-}
      data_path: /data
      download_path: /download/incomplete
      save_path: /download/anime
      background_workers_enabled: "true"
    ports:
      - "7991:7991"
    volumes:
      - ./data:/data
      - ./download:/download
    depends_on:
      qbittorrent-bt:
        condition: service_started
      qbittorrent-pt:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    networks:
      - animegonet

  qbittorrent-bt:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Shanghai}
      WEBUI_PORT: "8080"
    volumes:
      - ./qbittorrent/bt:/config
      - ./download:/download
    ports:
      - "8080:8080"
    security_opt:
      - no-new-privileges:true
    networks:
      - animegonet

  qbittorrent-pt:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Shanghai}
      WEBUI_PORT: "8080"
    volumes:
      - ./qbittorrent/pt:/config
      - ./download:/download
    ports:
      - "8081:8080"
    security_opt:
      - no-new-privileges:true
    networks:
      - animegonet

networks:
  animegonet:
    driver: bridge
